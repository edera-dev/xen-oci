name: nightly
on:
  workflow_dispatch:
  schedule:
  - cron: "0 0 * * *"
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  discover:
    name: discover xen branches
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.branches.outputs.list }}
    steps:
    - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit
    - name: List edera/* branches
      id: branches
      # Discovered rather than listed, so an edera/X.Y cut between runs is built
      # without editing this file. release.yaml keeps its explicit matrix: it
      # publishes the supported-version tags, which is a deliberate list.
      # edera-dev/xen is public, so this needs no token.
      #
      # The ls-remote glob is not a filter: `*` spans slashes, so it also
      # returns edera/foo-bar and edera/experimental/vpci. Only X.Y is a
      # maintained branch, so the shape is enforced here.
      run: |
        set -euo pipefail
        branches="$(git ls-remote --heads https://github.com/edera-dev/xen.git 'refs/heads/edera/*' \
          | sed 's#.*refs/heads/##' | grep -E '^edera/[0-9]+\.[0-9]+$' | sort -V)"
        if [ -z "${branches}" ]; then
          echo "::error::no edera/* branches found in edera-dev/xen"
          exit 1
        fi
        echo "${branches}"
        printf 'list=%s\n' \
          "$(printf '%s\n' "${branches}" | jq -Rsc 'split("\n") | map(select(length > 0))')" \
          >> "${GITHUB_OUTPUT}"

  build:
    needs: discover
    runs-on: edera-large
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.discover.outputs.branches) }}
    name: oci build xen (${{ matrix.branch }})
    steps:
    - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
    - name: allow unprivileged user namespaces
      # Ubuntu 24.04 runner images restrict unprivileged user namespace
      # creation via AppArmor; rootless buildkitd requires it.
      run: |
        if [ "$(sudo sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Rootless buildkit: RUN steps execute as an unprivileged user inside a
      # user namespace (still uid 0 in-image, so artifact ownership does not
      # change). Among other things this makes /dev/null a host bind mount
      # the build cannot delete or replace - a build once smuggled an ELF
      # object into /dev/null and poisoned every compiler probe that read it
      # afterwards. (Bump the image pin manually: dependabot does not track
      # driver-opts images.)
      with:
        driver-opts: image=moby/buildkit:v0.31.1-rootless@sha256:946cf909534b789c9b84af75e6d4f8cb23c3b9cb387daec5ba0f4878a3e4647c
        buildkitd-flags: --oci-worker-no-process-sandbox
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Compute image tag
      id: ref
      # Slashes are legal in a git ref but not in an OCI tag, where they would
      # read as registry path separators; map them (and anything else illegal)
      # the way branch.yml does. Needs a step because Actions expressions have
      # no replace().
      env:
        XEN_BRANCH: ${{ matrix.branch }}
      run: |
        set -euo pipefail
        {
          echo "tag=nightly-$(printf '%s' "${XEN_BRANCH}" | tr -c 'a-zA-Z0-9._-' '_')"
          echo "version=${XEN_BRANCH#edera/}"
        } >> "${GITHUB_OUTPUT}"
    - name: configure sccache
      id: sccache
      uses: edera-dev/actions/configure-azure-sccache@6e6996f6fff5d6016bcdc097e9065da6fb33ac7f # v0.0.17
      with:
        connection-string-rw: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING }}
        connection-string-ro: ${{ secrets.SCCACHE_AZURE_CONNECTION_STRING_RO }}
        key-prefix: xen
    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      id: push-step
      env:
        SCCACHE_AZURE_CONNECTION_STRING: ${{ steps.sccache.outputs.connection-string }}
      with:
        file: ./Dockerfile.xen
        platforms: linux/amd64,linux/aarch64
        tags: ghcr.io/edera-dev/xen:${{ steps.ref.outputs.tag }}
        build-args: |
          XEN_VERSION=${{ steps.ref.outputs.version }}
          XEN_BRANCH=${{ matrix.branch }}
          SCCACHE_AZURE_RW_MODE=${{ steps.sccache.outputs.rw-mode }}
        secret-envs: |
          sccache_conn=SCCACHE_AZURE_CONNECTION_STRING
        push: true
    - name: Sign the image
      env:
        DIGEST: ${{ steps.push-step.outputs.digest }}
        TAGS: ghcr.io/edera-dev/xen:${{ steps.ref.outputs.tag }}
        COSIGN_EXPERIMENTAL: "true"
      run: cosign sign --yes "${TAGS}@${DIGEST}"

    - name: Build `build` stage for SBOM scan
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      env:
        SCCACHE_AZURE_CONNECTION_STRING: ${{ steps.sccache.outputs.connection-string }}
      with:
        file: ./Dockerfile.xen
        target: build
        # single platform to only read source/commit metadata once, still sbom's all arches
        platforms: linux/amd64
        # build-args must match the main build exactly, or the ARG mismatch
        # busts the layer cache and this rebuilds the world.
        build-args: |
          XEN_VERSION=${{ steps.ref.outputs.version }}
          XEN_BRANCH=${{ matrix.branch }}
          SCCACHE_AZURE_RW_MODE=${{ steps.sccache.outputs.rw-mode }}
        secret-envs: |
          sccache_conn=SCCACHE_AZURE_CONNECTION_STRING
        load: true
        tags: sbom-scan-${{ matrix.component }}:latest
    - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
      id: syft
    # Build CycloneDX SBOM without build dependencies
    - name: Generate and attest CycloneDX SBOM
      env:
        DIGEST: ${{ steps.push-step.outputs.digest }}
        TAGS: ghcr.io/edera-dev/xen:${{ steps.ref.outputs.tag }}
        SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        COMPONENT: xen
        XEN_VERSION: ${{ steps.ref.outputs.version }}
        XEN_BRANCH: ${{ matrix.branch }}
        COSIGN_EXPERIMENTAL: "true"
      run: |
        set -euo pipefail
        scan="sbom-scan-${COMPONENT}:latest"

        # Resolve the exact source commit(s) the build checked out
        XEN_COMMIT="$(docker run --rm "${scan}" git -C /usr/src/xen rev-parse HEAD)"
        export XEN_COMMIT

        # Catalog the runtime apk packages that actually ship
        "${SYFT_CMD}" "registry:${TAGS}@${DIGEST}" \
          --platform linux/amd64 \
          --override-default-catalogers apk-db-cataloger \
          --select-catalogers "-file" \
          -o "cyclonedx-json=${COMPONENT}.syft.cdx.json"

        # Merge curated source(s) + patches + scanned packages into one SBOM.
        PKG_SBOM="${COMPONENT}.syft.cdx.json" python3 generate-sbom.py

        jq -e '.bomFormat == "CycloneDX" and ((.components // []) | length > 0)' \
          "${COMPONENT}.cdx.json" >/dev/null \
          || { echo "::error::SBOM for ${COMPONENT} is empty or invalid"; exit 1; }
        jq '{component: env.COMPONENT, components: (.components | length)}' \
          "${COMPONENT}.cdx.json"

        cosign attest --yes --type cyclonedx \
          --predicate "${COMPONENT}.cdx.json" \
          "${TAGS}@${DIGEST}"
